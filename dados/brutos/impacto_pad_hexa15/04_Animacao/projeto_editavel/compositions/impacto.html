<template><style>#root{position:absolute;inset:0;background:#f4f7fa}#impact-canvas{position:absolute;inset:0;width:1920px;height:1080px}</style><div id="root" data-composition-id="impacto" data-width="1920" data-height="1080"><canvas id="impact-canvas" class="clip" data-start="0" data-duration="10" data-track-index="0" width="1920" height="1080" aria-label="Representacao cinematica do PAD; modelo de molas, sem campo de deformacao por elementos finitos"></canvas></div><script>
(()=>{
 const data=window.SAMI_DATA, p=data.physics,cv=document.getElementById('impact-canvas'),c=cv.getContext('2d');
 const nvy='#173653', orange='#db6d18', cyan='#147da2';
 const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
 const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 const sub=(a,b)=>a.map((v,i)=>v-b[i]);
 const proj=(v)=>[630+5.7*(.86*v[0]-.51*v[1]),620+5.7*(-.27*v[0]-.455*v[1]-.848*v[2])];
 const tri=[];
 function prep(mesh,pad){for(const v of mesh){let n=cross(sub(v[1],v[0]),sub(v[2],v[0]));const len=Math.hypot(...n)||1;n=n.map(x=>x/len);const shade=.38+.62*Math.abs(dot(n,[-.35,-.35,.866]));const rgb=pad?[224,116,27]:[137,157,172];tri.push({v,pad,depth:v.reduce((s,q)=>s-.432*q[0]-.729*q[1]+.529*q[2],0)/3,color:'rgb('+rgb.map(x=>Math.round(x*shade)).join(',')+')'});}}
 prep(data.body,false);prep(data.pad,true);tri.sort((a,b)=>a.depth-b.depth);
 function text(s,x,y,size=28,color=nvy,weight='400'){c.font=weight+' '+size+'px Arial';c.fillStyle=color;c.fillText(s,x,y);}
 function line(x1,y1,x2,y2,color,width=2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke();}
 function state(t){const active=t<=p.T;const q=active?Math.max(0,p.v/p.omega*Math.sin(p.omega*t)*1000):0;const force=q*p.keq;const velocity=active?p.v*Math.cos(p.omega*t):-p.v;return {q,force,dp:force/p.kp,dg:force/p.kg,velocity,up:.5*force*force/p.kp/1000,ug:.5*force*force/p.kg/1000};}
 function draw(t){const time=Math.max(0,Math.min(.007,(t-1)/7.5*.007)),s=state(time),mag=2;c.fillStyle='#f4f7fa';c.fillRect(0,0,1920,1080);
 text('Impacto local na proteção R02',96,102,52,nvy,'700');text('PA-CF · Hexa3D 15% · 5 perímetros  |  PAD TPU95A · 40%',96,159,30);
 c.fillStyle='#e1e9f0';c.fillRect(96,190,1728,57);text('MODELO MATEMÁTICO 1D  •  Cinemática imposta no CAD  •  Não é FEA',118,228,27,nvy,'700');
 for(const tr of tri){const vs=tr.v.map(v=>{let xx=v[0]+s.dg*mag;if(tr.pad)xx+=s.dp*mag*Math.max(0,Math.min(1,(-31.5-v[0])/6.3));return proj([xx,v[1],v[2]]);});c.beginPath();c.moveTo(...vs[0]);c.lineTo(...vs[1]);c.lineTo(...vs[2]);c.closePath();c.fillStyle=tr.color;c.fill();}
 let sphereX=data.sphere_contact_center_x+(time<=p.T?s.q:-p.v*(time-p.T)*1000)*mag;const [sx,sy]=proj([sphereX,0,0]);const g=c.createRadialGradient(sx-35,sy-35,5,sx,sy,114);g.addColorStop(0,'#eef4f7');g.addColorStop(.4,'#9aaab4');g.addColorStop(1,'#354956');c.beginPath();c.arc(sx,sy,114,0,Math.PI*2);c.fillStyle=g;c.fill();
 text('Recorte visual A1 da montagem',112,885,29,nvy,'700');text('Geometria nominal + deslocamentos ilustrativos ×2',112,925,27);text('O núcleo Hexa3D não está desenhado neste CAD.',112,965,25);
 line(1110,285,1110,934,'#cad6df',2);
 text('EXEMPLO DE COLISÃO',1180,312,26,cyan,'700');text('263 g a 1 m/s  |  0,132 J',1180,363,35,nvy,'700');text('Tempo físico: '+(time*1000).toFixed(2)+' ms',1180,413,29);
 text('Força instantânea: '+s.force.toFixed(0)+' N',1180,464,29);text('Compressão do PAD: '+s.dp.toFixed(2)+' mm',1180,511,29);
 text('Energia no PAD: '+s.up.toFixed(3)+' J',1180,558,29,orange);text('Dissipada: 0 J na hipótese elástica',1180,601,25,nvy);
 const X=1214,Y=854,W=540,H=180;line(X,Y,X+W,Y,'#8195a5');line(X,Y,X,Y-H,'#8195a5');
 const omegaBare=Math.sqrt(p.kg*1000/p.m),endBare=Math.PI/omegaBare;
 function curve(k,omega,end,color){c.beginPath();for(let i=0;i<=200;i++){const tt=.007*i/200,f=tt<=end?Math.max(0,p.v/omega*Math.sin(omega*tt)*1000*k):0;const xx=X+W*i/200,yy=Y-H*f/(p.bareF*1.05);if(i===0)c.moveTo(xx,yy);else c.lineTo(xx,yy);}c.strokeStyle=color;c.lineWidth=3;c.stroke();}
 curve(p.kg,omegaBare,endBare,nvy);curve(p.keq,p.omega,p.T,orange);line(X+W*time/.007,Y+6,X+W*time/.007,Y-H,'#8ba0af',2);
 text('0',X-7,Y+33,22);text('7 ms',X+W-44,Y+33,22);text('Força: sem PAD / com PAD',1180,653,25);text('Picos do modelo: '+p.bareF.toFixed(0)+' / '+p.peakF.toFixed(0)+' N',1180,925,29,nvy,'700');
 text('Seção da garra e área de contato assumidas. Sem ruptura, desgaste, temperatura ou amortecimento.',96,1002,26);
 }
 const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:10,duration:10,ease:'none',onUpdate:()=>draw(clock.t)},0);window.__timelines=window.__timelines||{};window.__timelines.impacto=tl;window.addEventListener('hf-seek',e=>draw(e.detail.time));draw(0);
})();
</script></template>
